name: Bygg image

# Bygger Docker-images till GitHub Container Registry och släpper sedan versionen:
#   ghcr.io/<ägare>/familjetavla:<version> och :latest  (multi-arch, för docker compose)
#   ghcr.io/<ägare>/familjetavla-amd64 / -aarch64     (för Home Assistant-tillägget)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Unit tests plus the full end-to-end run of the real image. Nothing is published unless they pass.
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          # The version to build comes from package.json. familjetavla/config.yaml is only raised
          # by the "release" job below, after the images exist – Home Assistant offers the update
          # as soon as config.yaml on main changes, and would otherwise hit "manifest unknown".
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tag
        run: |
          V=$(node -p "require('./package.json').version")
          O=ghcr.io/${{ github.repository_owner }}
          for T in "$V" latest; do
            docker buildx imagetools create -t "$O/familjetavla:$T" "$O/familjetavla-amd64:$V" "$O/familjetavla-aarch64:$V"
          done

  # Only now tell Home Assistant (and the board's "Ny version finns") that the version exists.
  release:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull the images once more – never announce a version that cannot be pulled
        run: |
          V=$(node -p "require('./package.json').version")
          for I in familjetavla familjetavla-amd64 familjetavla-aarch64; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/$I:$V" > /dev/null
          done
      - name: Raise the add-on version
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/^version: .*/version: \"$V\"/" familjetavla/config.yaml
          if git diff --quiet; then echo "config.yaml already says $V"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Släpp $V till Home Assistant (images finns på ghcr)"
          git push origin HEAD:main
