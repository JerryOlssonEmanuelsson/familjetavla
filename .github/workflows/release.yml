name: Bygg image

# Bygger Docker-images till GitHub Container Registry:
#   ghcr.io/<ägare>/familjetavla:<version> och :latest  (multi-arch, för docker compose)
#   ghcr.io/<ägare>/familjetavla-amd64 / -aarch64     (för Home Assistant-tillägget)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Unit tests plus the full end-to-end run of the real image. Nothing is published unless they pass.
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          # Home Assistant pulls the image tag named in config.yaml, so the two must match.
          A=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' familjetavla/config.yaml)
          if [ "$V" != "$A" ]; then echo "::error::package.json ($V) och familjetavla/config.yaml ($A) har olika version"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tag
        run: |
          V=$(node -p "require('./package.json').version")
          O=ghcr.io/${{ github.repository_owner }}
          for T in "$V" latest; do
            docker buildx imagetools create -t "$O/familjetavla:$T" "$O/familjetavla-amd64:$V" "$O/familjetavla-aarch64:$V"
          done
